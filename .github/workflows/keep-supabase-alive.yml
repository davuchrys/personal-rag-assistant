# Prevents the Supabase free-tier project from auto-pausing after 7 idle days
# by making one tiny read query every 3 days. Requires two repository secrets
# (Settings > Secrets and variables > Actions): SUPABASE_URL and SUPABASE_KEY.
#
# Also commits a heartbeat file each run: GitHub auto-disables scheduled
# workflows after 60 days with no repository push activity, and a workflow
# that only reads from an external API never counts as "activity" on its own.
name: Keep Supabase alive

on:
  schedule:
    - cron: "0 1 */3 * *" # 01:00 UTC every 3rd day — well inside the 7-day pause window
  workflow_dispatch: # allows manual runs from the Actions tab, e.g. before a demo

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query Supabase REST API
        run: |
          curl --silent --fail --show-error \
            "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=username&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            --output /dev/null
          echo "Supabase pinged successfully."

      - name: Record heartbeat (keeps repo active so GitHub doesn't disable this schedule)
        run: |
          mkdir -p .github
          date -u +"Last ping: %Y-%m-%dT%H:%M:%SZ" > .github/last-supabase-ping.txt

      - name: Commit heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/last-supabase-ping.txt
          git diff --staged --quiet || git commit -m "chore: supabase keep-alive heartbeat"
          git push
